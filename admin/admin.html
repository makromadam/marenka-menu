<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Marenka — Yönetim Paneli</title>
  <!--ADMIN_CSS-->
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="topbar__brand">Marenka <small>Yönetim Paneli</small></span>
      <button id="btn-add-section" class="btn btn--sm" type="button">+ Bölüm</button>
      <div class="topbar__spacer"></div>
      <button id="btn-preview" class="btn btn--ghost btn--sm" type="button">Önizle</button>
      <button id="btn-import" class="btn btn--ghost btn--sm" type="button">İçe aktar</button>
      <button id="btn-reset" class="btn btn--ghost btn--sm" type="button">Orijinale dön</button>
      <button id="btn-data" class="btn btn--sm" type="button">Veri indir (menu.js)</button>
      <button id="btn-html" class="btn btn--primary btn--sm" type="button">Menüyü indir (HTML)</button>
      <span id="status" class="topbar__status">Hazır</span>
    </header>

    <div class="main">
      <aside class="tree">
        <div id="tree-body"></div>
      </aside>
      <main id="detail" class="detail"></main>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <input id="file-import" class="hidden-file" type="file" accept=".js,.json,.html,application/json,text/javascript,text/html" />

  <!--MENU_DATA_SCRIPT-->

</html>
